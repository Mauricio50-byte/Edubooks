<div class="filters-section">
  <div class="section-header">
    <h2 class="section-title">
      <ion-icon name="filter-outline" class="section-icon"></ion-icon>
      {{ title }}
    </h2>
    <div class="filter-summary" *ngIf="filteredCount !== totalCount">
      <ion-chip color="primary" class="filter-chip">
        <ion-icon name="funnel-outline" slot="start"></ion-icon>
        <ion-label>{{ filteredCount }} de {{ totalCount }}</ion-label>
      </ion-chip>
    </div>
  </div>

  <div class="filters-grid">
    <div class="search-container">
      <ion-searchbar 
        [placeholder]="placeholderBusqueda"
        [(ngModel)]="filtroTexto"
        (ionInput)="onSearchInput($event)"
        debounce="300"
        class="dark-searchbar">
        <ion-icon name="search-outline" slot="start"></ion-icon>
      </ion-searchbar>
    </div>

    <div class="filters-container">
      <div class="filter-chips">
        <div class="chip-group rol-chip-group">
          <div class="group-label">
            <ion-icon name="people-outline"></ion-icon>
            Filtrar por Rol
          </div>
          <div class="chips">
            <ion-chip color="primary" [outline]="filtroRol !== ''" (click)="selectRol('')">
              <ion-icon name="people-outline" slot="start"></ion-icon>
              <ion-label>{{ getFirstLabel(rolOptions, 'Todos los roles') }}</ion-label>
            </ion-chip>
            <ion-chip *ngFor="let opt of rolOptions.slice(1)" [color]="opt.color || 'primary'" [outline]="filtroRol !== opt.value" (click)="selectRol(opt.value)">
              <ion-icon [name]="opt.icon" slot="start"></ion-icon>
              <ion-label>{{ opt.label }}</ion-label>
            </ion-chip>
          </div>
        </div>

        <div class="chip-group estado-chip-group">
          <div class="group-label">
            <ion-icon name="checkmark-circle-outline"></ion-icon>
            Filtrar por Estado
          </div>
          <div class="chips">
            <ion-chip color="success" [outline]="filtroEstado !== ''" (click)="selectEstado('')">
              <ion-icon name="list-outline" slot="start"></ion-icon>
              <ion-label>{{ getFirstLabel(estadoOptions, 'Todos los estados') }}</ion-label>
            </ion-chip>
            <ion-chip *ngFor="let opt of estadoOptions.slice(1)" [color]="opt.color || 'primary'" [outline]="filtroEstado !== opt.value" (click)="selectEstado(opt.value)">
              <ion-icon [name]="opt.icon" slot="start"></ion-icon>
              <ion-label>{{ opt.label }}</ion-label>
            </ion-chip>
          </div>
        </div>
      </div>
    </div>

    <div class="filter-actions">
      <ion-button 
        fill="outline" 
        color="medium" 
        (click)="clearAll()"
        class="clear-filters-btn">
        <ion-icon name="refresh-outline" slot="start"></ion-icon>
        Limpiar Filtros
      </ion-button>
    </div>
  </div>
</div>
