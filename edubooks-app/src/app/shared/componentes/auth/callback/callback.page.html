<ion-header [translucent]="true">
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">
      <ion-icon name="book-outline" style="margin-right: 8px;"></ion-icon>
      EduBooks
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="callback-content">
  <div class="callback-container">
    <div class="loading-section">
      <ion-spinner name="dots" class="loading-spinner"></ion-spinner>
      <h2>Completando autenticación...</h2>
      <p>Por favor espera mientras procesamos tu inicio de sesión.</p>
    </div>
  </div>
</ion-content>
