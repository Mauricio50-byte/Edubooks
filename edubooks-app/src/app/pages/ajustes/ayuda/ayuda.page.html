<ion-header [translucent]="true">
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Ayuda</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="ajustes-container">
    <ion-card class="card-accent">
      <ion-card-header>
        <ion-card-title>Centro de Ayuda</ion-card-title>
        <ion-card-subtitle>Preguntas frecuentes</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-list>
          <ion-item>
            <ion-icon name="help-circle-outline" slot="start" color="tertiary"></ion-icon>
            <ion-label>
              <h3>¿Cómo inicio sesión?</h3>
              <p>Usa tu email y contraseña registrada.</p>
            </ion-label>
          </ion-item>
          <ion-item>
            <ion-icon name="information-circle-outline" slot="start" color="tertiary"></ion-icon>
            <ion-label>
              <h3>¿Cómo busco libros?</h3>
              <p>Entra a Catálogo y usa la barra de búsqueda.</p>
            </ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
