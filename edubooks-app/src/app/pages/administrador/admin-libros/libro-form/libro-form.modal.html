<ion-header>
  <ion-toolbar>
    <ion-title>Registrar Libro</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" color="medium" (click)="cancelar()">
        <ion-icon name="close-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form [formGroup]="form" (ngSubmit)="confirmar()" class="libro-form">
    <ion-list lines="inset" class="form-list">
      <ion-item-divider>
        <ion-label>Datos para registro</ion-label>
      </ion-item-divider>
      <ion-item>
        <ion-icon name="search-outline" slot="start"></ion-icon>
        <ion-label position="floating">Búsqueda (ISBN o título)</ion-label>
        <ion-input formControlName="busqueda" inputmode="text" autocomplete="off" autocapitalize="sentences" placeholder="9780307474278 o Cien años de soledad"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="form.get('busqueda')?.touched && form.get('busqueda')?.invalid">Ingresa al menos 2 caracteres.</ion-note>

      <ion-item>
        <ion-icon name="layers-outline" slot="start"></ion-icon>
        <ion-label position="floating">Cantidad total</ion-label>
        <ion-input formControlName="cantidad_total" type="number" min="1" inputmode="numeric"></ion-input>
      </ion-item>
      <ion-note color="danger" *ngIf="form.get('cantidad_total')?.touched && form.get('cantidad_total')?.invalid">La cantidad debe ser al menos 1.</ion-note>

      <ion-item>
        <ion-icon name="location-outline" slot="start"></ion-icon>
        <ion-label position="floating">Ubicación (ej: A1-001)</ion-label>
        <ion-input formControlName="ubicacion" placeholder="A1-001" autocapitalize="characters"></ion-input>
      </ion-item>
      <ion-note color="medium">Formato: Letra + dígito - 3 dígitos (A1-001)</ion-note>

    </ion-list>

    <div class="actions">
      <ion-button type="submit" expand="block" color="primary">
        <ion-icon name="cloud-download-outline" slot="start"></ion-icon>
        Buscar y Registrar
      </ion-button>
      <ion-button type="button" expand="block" fill="outline" color="medium" (click)="form.reset({ busqueda: '', cantidad_total: 1, ubicacion: 'A1-001', categoria: '' })">
        <ion-icon name="refresh-outline" slot="start"></ion-icon>
        Limpiar
      </ion-button>
    </div>
  </form>
</ion-content>
