<ion-header>
  <ion-toolbar>
    <ion-title>Vista previa del libro</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="cancelar()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="portada">
    <ion-img [src]="libro?.imagen_portada || 'https://via.placeholder.com/400x600?text=Portada+No+Disponible'" alt="Portada"></ion-img>
  </div>

  <div class="info">
    <h2>{{ tituloLimpio }}</h2>
    <p><strong>Autor:</strong> {{ autorLimpio }}</p>
    <p><strong>ISBN:</strong> {{ isbnLimpio }}</p>
    <p><strong>Editorial:</strong> {{ editorialLimpia }}</p>
    <p><strong>Año:</strong> {{ anioLimpio }}</p>
    <p class="descripcion"><strong>Descripción:</strong> {{ descripcionLimpia }}</p>

    <ion-item lines="none">
      <ion-label>Cantidad</ion-label>
      <ion-note>{{ cantidad_total }}</ion-note>
    </ion-item>
    <ion-item lines="none">
      <ion-label>Ubicación</ion-label>
      <ion-note>{{ ubicacion }}</ion-note>
    </ion-item>
  </div>

  <div class="actions">
    <ion-button expand="block" color="medium" (click)="cancelar()">Cancelar</ion-button>
    <ion-button expand="block" color="primary" (click)="confirmar()">Registrar Libro</ion-button>
  </div>
</ion-content>
